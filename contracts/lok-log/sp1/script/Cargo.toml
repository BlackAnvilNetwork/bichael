[package]
name = "lok-sp1-execute"
version = "0.1.0"
edition = "2021"
publish = false
description = "Execute the lok-engine SP1 guest. Does not prove or pin a verifying key."

[[bin]]
name = "lok-sp1-execute"
path = "src/main.rs"

[dependencies]
hex = "0.4"
lok-sp1-executor = { path = "../executor" }
serde_json = "1"
sp1-sdk = "=6.9.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
sp1-build = "=6.9.0"
